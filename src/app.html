<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.png?v=2" />
		<link href="https://fonts.googleapis.com/css2?family=Norican&display=swap" rel="stylesheet">
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
		
		<!-- SEO Meta Tags -->
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Bareey - The trusted marketplace for buying, selling, and accessing professional services. Connect with your community securely and simply." />
		<meta name="keywords" content="marketplace, buy, sell, services, community, trusted, secure transactions, Nigeria" />
		<meta name="author" content="Bareey Inc." />
		<meta name="robots" content="index, follow" />
		
		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://bareey.com" />
		<meta property="og:title" content="Bareey - Trusted Marketplace for Your Community" />
		<meta property="og:description" content="Buy, sell, and access professional services with confidence. Bareey connects you to what you need, securely and simply." />
		<meta property="og:image" content="/assets/android-mockup.png" />
		
		<!-- Twitter -->
		<meta property="twitter:card" content="summary_large_image" />
		<meta property="twitter:url" content="https://bareey.com" />
		<meta property="twitter:title" content="Bareey - Trusted Marketplace for Your Community" />
		<meta property="twitter:description" content="Buy, sell, and access professional services with confidence." />
		<meta property="twitter:image" content="/assets/android-mockup.png" />
		
		<!-- Canonical URL -->
		<link rel="canonical" href="https://bareey.com" />
		
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
